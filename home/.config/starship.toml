# Lightweight two-line Starship prompt for Ghostty + Solarized Dark.
add_newline = true
command_timeout = 500
scan_timeout = 30

format = """
$directory$git_branch$git_status$cmd_duration$status
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "purple"
format = "on [$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = ""
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "took [$duration]($style) "

[status]
disabled = false
symbol = "✘ "
style = "red"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](yellow)"
